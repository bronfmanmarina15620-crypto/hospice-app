<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>המטופלים של מרינה</title><style>
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f3f6f4;color:#24343a;text-align:right;direction:rtl}
header{background:linear-gradient(135deg,#2f6f68,#4f9a8f);color:#fff;padding:18px;display:flex;align-items:center;gap:12px}
header img{width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:#fff}
header h1{font-size:20px;margin:0}header small{opacity:.85}
main{padding:14px;max-width:640px;margin:auto}
.pbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:0;border-radius:16px;padding:18px;margin:10px 0;box-shadow:0 2px 8px #0001;font-size:22px;font-weight:700;color:#2f6f68;cursor:pointer;text-align:right}
.pbtn span{font-size:14px;color:#667;font-weight:400}
details{background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 1px 5px #0001;overflow:hidden}
summary{padding:15px;font-weight:700;font-size:17px;cursor:pointer;color:#2f6f68;list-style:none}
summary::after{content:"▾";float:left}details[open]>summary::after{content:"▴"}
.in{padding:0 15px 15px;line-height:1.6}details details{box-shadow:none;border:1px solid #e3ebe8}
ul{padding-right:20px;margin:6px 0}.lbl{color:#667;font-size:14px}.warn{color:#a3562b}
.back{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.btns button{background:#2f6f68;color:#fff;border:0;border-radius:10px;padding:10px 12px;margin:4px;font-size:15px}
textarea{width:100%;min-height:150px;box-sizing:border-box;font-family:inherit;direction:rtl}
.ib{background:#e6f1ef;color:#2f6f68;border:0;border-radius:50%;width:28px;height:28px;font-size:16px;margin-right:6px;cursor:pointer}
.cl li{list-style:none;margin:6px 0;display:flex;align-items:center;justify-content:space-between}.cl{padding:0}
#mo{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:9}#mo[hidden]{display:none}
.card{background:#fff;border-radius:18px 18px 0 0;padding:18px;max-width:640px;width:100%;max-height:80vh;overflow:auto;position:relative}
.card h3{margin:0 0 6px;color:#2f6f68}.x{position:absolute;left:12px;top:12px;border:0;background:none;font-size:20px}.src{margin-top:8px;font-size:14px}.src a{color:#2f6f68}
</style></head><body><header><img src="LOGO" alt="MARINA"><div><h1 id="ttl">המטופלים שלי</h1><small id="sub">טיפול תומך · מחוז ת"א</small></div><button class="back" id="back" hidden onclick="home()">→ חזרה</button></header>
<main id="m"></main><div id="mo" hidden onclick="if(event.target===this)this.hidden=true"></div><script>
const P=/*DATA*/;const INFO=/*INFO*/;
const E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const L=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'<span class="lbl">—</span>';
const D=d=>d?d.split('-').reverse().join('.'):'';
const sec=(t,h)=>`<details><summary>${t}</summary><div class="in">${h}</div></details>`;
const EV=[['תלונות','תלונות'],['הידרציה','הידרציה'],['תזונה / לא אוכלת מספיק','תזונה'],['בליעה / אספירציה','בליעה'],['היענות / תגובה לטיפול','היענות'],['שחיקה / אלימות במשפחה','משפחה'],['הפרעות שינה','שינה'],['כאב','כאב'],['מצב נשימתי','נשימה'],['פעולות מעיים / עצירות','מעיים'],['מצב רגשי','רגשי'],['פה וריריות','פה'],['הדרכה','הדרכה']];
const FV=[['ADL','ADL'],['POS (כל חודשיים)','POS'],['נורטון','Norton'],['עור / פצעי לחץ','עור'],['הכרה / דליריום','הכרה'],['בדיקת טיפול תרופתי','תרופות'],['נפילות','נפילות'],['שליטה על מתן שתן','שתן'],['5 שאלות','5שאלות'],['מטפל עיקרי','מטפל']];
const CL=a=>'<ul class="cl">'+a.map(([l,k])=>`<li><label><input type="checkbox"> ${l}</label> <button class="ib" onclick="info('${k}')" aria-label="מידע">ⓘ</button></li>`).join('')+'</ul>';
function info(k){const c=INFO[k];if(!c)return;mo.innerHTML=`<div class="card"><button class="x" onclick="mo.hidden=true">✕</button><h3>${E(c.t)}</h3>${L(c.b)}<div class="src">מקור: ${c.u?`<a href="${c.u}" target="_blank" rel="noopener">${E(c.s)}</a>`:E(c.s)}</div><div class="lbl">תזכורת בלבד – לא מחליף נוהל או הוראת רופא.</div></div>`;mo.hidden=false}
function home(){ttl.textContent='המטופלים שלי';back.hidden=true;
m.innerHTML=P.map((p,i)=>{const v=p.visits.at(-1);return `<button class="pbtn" onclick="show(${i})">${E(p.initials)}<span>${p.age?'בן/בת '+p.age+' · ':''}ביקור אחרון ${v?D(v.date):'—'}${p.visit_frequency?' · '+E(p.visit_frequency):''}<br>${due(p)}</span></button>`}).join('');}
function due(p){const v=p.visits.at(-1);if(!v||!p.visit_frequency_days)return '';const d=new Date(v.date);d.setDate(d.getDate()+p.visit_frequency_days);const t=new Date();t.setHours(0,0,0,0);const s=d.toISOString().slice(0,10);return d<t?`<b class="warn">⚠ ביקור הבא היה אמור להיות ב־${D(s)} (באיחור)</b>`:`ביקור הבא עד ${D(s)}`}
function last(p){return p.visits.at(-1)||{}}
function diff(p){const n=p.visits.length;if(n<2)return 'ביקור ראשון במעקב – אין ביקור קודם להשוואה.';const a=p.visits[n-2].fields||{},b=p.visits[n-1].fields||{};const ch=Object.keys(b).filter(k=>a[k]!==b[k]).map(k=>`${k}: ${a[k]||'—'} ← ${b[k]}`);return ch.length?'שינויים מהביקור הקודם ('+D(p.visits[n-2].date)+'):\n- '+ch.join('\n- '):'ללא שינוי בשדות לעומת הביקור הקודם.'}
function vtext(v){return v.summary+((v.amendments||[]).length?'\nתיקונים: '+v.amendments.map(a=>D(a.date)+' – '+a.text).join('; '):'')}
function summ(p,k){const v=last(p);const h=`${p.initials}${p.age?', '+p.age:''} – ביקור ${D(v.date)}`;const df=diff(p);
return {doc:`לכבוד ${p.doctor||'הרופא/ה'}\n${h}\n\n${vtext(v)}\n\n${df}\n\nדגשים:\n- ${p.next_focus.join('\n- ')}`,
short:`${h}: ${v.summary.split('.').slice(0,3).join('.')}.\n${df}`,
fam:`שלום, עדכון מביקור (${D(v.date)}):\n${v.summary}\nאני זמינה לכל שאלה. מרינה, אחות היחידה הפליאטיבית`,
mail:`סיכום ביקור – ${h}\n\n${Object.entries(v.fields||{}).map(([a,b])=>a+': '+b).join('\n')}\n\n${vtext(v)}\n\n${df}\n\nמרינה, אחות היחידה הפליאטיבית מחוז ת"א-יפו`}[k]}
const ST={doc:'לרופא',short:'קצר',fam:'למשפחה',mail:'מייל עבודה'};
function gen(i,k){document.getElementById('out').value=summ(P[i],k)}
function show(i){const p=P[i],v=last(p);ttl.textContent=p.initials+(p.status==='discharged'?' (שוחרר/ה '+D(p.discharge_date)+')':'');back.hidden=false;scrollTo(0,0);
m.innerHTML=
sec('רקע בקצרה',`<b>גיל:</b> ${p.age??'<span class="warn">חסר</span>'} · <b>מסגרת:</b> ${E(p.program)}<br><b>תדירות ביקורים:</b> ${E(p.visit_frequency)||'<span class="warn">חסר</span>'}<br>${due(p)}<br><b>רופא/ה:</b> ${E(p.doctor)}<br><b>מטפל עיקרי:</b> ${E(p.caregiver)}<br><b>תפקוד:</b> ${E(p.function)}<br><b>אבחנות:</b>${L(p.diagnoses)}<b>גורמי סיכון:</b>${L(p.risk_factors)}<b>תרופות כיום:</b>${L(p.meds)}${p.meds_printout?`<b class="warn">⚠ רשימה בתדפיס כללית (לא תואמת):</b>${L(p.meds_printout)}`:''}${p.referral?`<b>בהפניה:</b><p>${E(p.referral)}</p>`:''}`)+
sec('סיכום הביקור האחרון',`<b>${D(v.date)} ${E(v.time)}</b><p>${E(v.summary)}</p>${Object.entries(v.fields||{}).map(([a,b])=>`<div><span class="lbl">${E(a)}:</span> ${E(b)}</div>`).join('')}`)+
sec('דגשים לביקור הבא',L(p.next_focus))+
sec('רשימת בדיקה לביקור',`<b>בכל ביקור:</b>${CL(EV)}<b>בביקור ראשון / בשינוי:</b>${CL(FV)}`)+
sec('היסטוריה (נשמרת עד שחרור)',sec(`ביקורים (${p.visits.length})`,[...p.visits].reverse().map(x=>sec(D(x.date)+' '+E(x.time),`<p>${E(x.summary)}</p>${(x.amendments||[]).map(a=>`<p class="warn">תיקון ${D(a.date)}: ${E(a.text)}</p>`).join('')}<div class="lbl">מקור: ${E(x.source)}</div>`)).join('')||'—')+sec(`סיכומים שנשלחו (${(p.summaries||[]).length})`,(p.summaries||[]).slice().reverse().map(s=>sec(D(s.date)+' · '+E(ST[s.type]||s.type)+(s.sent_to?' · '+E(s.sent_to):''),`<p style="white-space:pre-wrap">${E(s.text)}</p>`)).join('')||'<span class="lbl">עדיין לא נשמרו סיכומים. סיכום נשמר כשהסוכן מעדכן את הקובץ.</span>'))+
sec('מגמות וסיכומים',`<p class="lbl">הכפתורים מייצרים טיוטה מכל ההיסטוריה (כולל שינויים מהביקור הקודם). הטיוטה לא נשמרת מכאן – שמירה קבועה נעשית דרך הסוכן.</p><div class="btns"><button onclick="gen(${i},'doc')">לרופא</button><button onclick="gen(${i},'short')">קצר</button><button onclick="gen(${i},'fam')">למשפחה</button><button onclick="gen(${i},'mail')">מייל עבודה</button></div><textarea id="out" readonly></textarea>`)+
sec('חסר / לבדיקה',`<b>חסר:</b>${L(p.missing)}<b>אי־התאמות:</b>${L(p.discrepancies)}`);}
home();</script></body></html>
