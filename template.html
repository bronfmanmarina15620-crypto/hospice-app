<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>המטופלים של מרינה</title><style>
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f3f6f4;color:#24343a;text-align:right;direction:rtl}
header{background:linear-gradient(135deg,#2f6f68,#4f9a8f);color:#fff;padding:18px;display:flex;align-items:center;gap:12px}
header img{width:52px;height:52px;border-radius:50%;border:2px solid #fff;background:#fff}
header h1{font-size:20px;margin:0}header small{opacity:.85}
main{padding:14px;max-width:640px;margin:auto}
.pbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:#fff;border:0;border-radius:16px;padding:18px;margin:10px 0;box-shadow:0 2px 8px #0001;font-size:22px;font-weight:700;color:#2f6f68;cursor:pointer;text-align:right}
.pbtn span{font-size:14px;color:#667;font-weight:400}
details{background:#fff;border-radius:14px;margin:10px 0;box-shadow:0 1px 5px #0001;overflow:hidden}
summary{padding:15px;font-weight:700;font-size:17px;cursor:pointer;color:#2f6f68;list-style:none}
summary::after{content:"▾";float:left}details[open]>summary::after{content:"▴"}
.in{padding:0 15px 15px;line-height:1.6}details details{box-shadow:none;border:1px solid #e3ebe8}
ul{padding-right:20px;margin:6px 0}.lbl{color:#667;font-size:14px}.warn{color:#a3562b}
.back{background:none;border:0;color:#fff;font-size:16px;cursor:pointer}
.btns button{background:#2f6f68;color:#fff;border:0;border-radius:10px;padding:10px 12px;margin:4px;font-size:15px}
textarea{width:100%;min-height:150px;box-sizing:border-box;font-family:inherit;direction:rtl}
</style></head><body><header><img src="LOGO" alt="MARINA"><div><h1 id="ttl">המטופלים שלי</h1><small id="sub">טיפול תומך · מחוז ת"א</small></div><button class="back" id="back" hidden onclick="home()">→ חזרה</button></header>
<main id="m"></main><script>
const P=/*DATA*/;
const E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const L=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul>':'<span class="lbl">—</span>';
const D=d=>d?d.split('-').reverse().join('.'):'';
const sec=(t,h)=>`<details><summary>${t}</summary><div class="in">${h}</div></details>`;
const EV=['תלונות','הידרציה','היענות / תגובה לטיפול','שחיקה / אלימות במשפחה','הפרעות שינה','כאב','מצב נשימתי','פעולות מעיים','מצב רגשי','פה וריריות','הדרכה'];
const FV=['ADL','POS (כל חודשיים)','עור / פצעים','הכרה','בדיקת טיפול תרופתי','נפילות','שליטה על מתן שתן','5 שאלות','מטפל עיקרי'];
function home(){ttl.textContent='המטופלים שלי';back.hidden=true;
m.innerHTML=P.map((p,i)=>{const v=p.visits.at(-1);return `<button class="pbtn" onclick="show(${i})">${E(p.initials)}<span>${p.age?'בן/בת '+p.age+' · ':''}ביקור אחרון ${v?D(v.date):'—'}${p.visit_frequency?' · '+E(p.visit_frequency):''}<br>${due(p)}</span></button>`}).join('');}
function due(p){const v=p.visits.at(-1);if(!v||!p.visit_frequency_days)return '';const d=new Date(v.date);d.setDate(d.getDate()+p.visit_frequency_days);const t=new Date();t.setHours(0,0,0,0);const s=d.toISOString().slice(0,10);return d<t?`<b class="warn">⚠ ביקור הבא היה אמור להיות ב־${D(s)} (באיחור)</b>`:`ביקור הבא עד ${D(s)}`}
function last(p){return p.visits.at(-1)||{}}
function summ(p,k){const v=last(p);const h=`${p.initials}${p.age?', '+p.age:''} – ביקור ${D(v.date)}`;
return {doc:`לכבוד ${p.doctor||'הרופא/ה'}\n${h}\n\n${v.summary}\n\nדגשים:\n- ${p.next_focus.join('\n- ')}`,
short:`${h}: ${v.summary.split('.').slice(0,3).join('.')}.`,
fam:`שלום, עדכון מביקור היום (${D(v.date)}):\n${v.summary}\nאני זמינה לכל שאלה. מרינה, אחות היחידה הפליאטיבית`,
mail:`סיכום ביקור – ${h}\n\n${Object.entries(v.fields||{}).map(([a,b])=>a+': '+b).join('\n')}\n\n${v.summary}\n\nמרינה, אחות היחידה הפליאטיבית מחוז ת"א-יפו`}[k]}
function gen(i,k){document.getElementById('out').value=summ(P[i],k)}
function show(i){const p=P[i],v=last(p);ttl.textContent=p.initials;back.hidden=false;scrollTo(0,0);
m.innerHTML=
sec('רקע בקצרה',`<b>גיל:</b> ${p.age??'<span class="warn">חסר</span>'} · <b>מסגרת:</b> ${E(p.program)}<br><b>תדירות ביקורים:</b> ${E(p.visit_frequency)||'<span class="warn">חסר</span>'}<br>${due(p)}<br><b>רופא/ה:</b> ${E(p.doctor)}<br><b>מטפל עיקרי:</b> ${E(p.caregiver)}<br><b>תפקוד:</b> ${E(p.function)}<br><b>אבחנות:</b>${L(p.diagnoses)}<b>גורמי סיכון:</b>${L(p.risk_factors)}<b>תרופות כיום:</b>${L(p.meds)}${p.meds_printout?`<b class="warn">⚠ רשימה בתדפיס כללית (לא תואמת):</b>${L(p.meds_printout)}`:''}${p.referral?`<b>בהפניה:</b><p>${E(p.referral)}</p>`:''}`)+
sec('סיכום הביקור האחרון',`<b>${D(v.date)} ${E(v.time)}</b><p>${E(v.summary)}</p>${Object.entries(v.fields||{}).map(([a,b])=>`<div><span class="lbl">${E(a)}:</span> ${E(b)}</div>`).join('')}`)+
sec('דגשים לביקור הבא',L(p.next_focus))+
sec('רשימת בדיקה לביקור',`<b>בכל ביקור:</b><ul>${EV.map(x=>`<li><label><input type="checkbox"> ${x}</label></li>`).join('')}</ul><b>בביקור ראשון / בשינוי:</b><ul>${FV.map(x=>`<li><label><input type="checkbox"> ${x}</label></li>`).join('')}</ul>`)+
sec('היסטוריית ביקורים',[...p.visits].reverse().map(x=>sec(D(x.date)+' '+E(x.time),`<p>${E(x.summary)}</p><div class="lbl">מקור: ${E(x.source)}</div>`)).join(''))+
sec('מגמות וסיכומים',`<p class="lbl">מגמות יוצגו כשיצטברו נתונים מובנים (v1).</p><div class="btns"><button onclick="gen(${i},'doc')">לרופא</button><button onclick="gen(${i},'short')">קצר</button><button onclick="gen(${i},'fam')">למשפחה</button><button onclick="gen(${i},'mail')">מייל עבודה</button></div><textarea id="out" readonly></textarea>`)+
sec('חסר / לבדיקה',`<b>חסר:</b>${L(p.missing)}<b>אי־התאמות:</b>${L(p.discrepancies)}`);}
home();</script></body></html>
